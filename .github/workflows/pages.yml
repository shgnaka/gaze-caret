name: Publish experiment
on:
  push:
    branches: [experiment]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experiment-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout with Git
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - run: bash scripts/ci-install-deno.sh
      - run: deno ci
      - run: deno task check
      - run: deno task build
        env:
          VITE_DIAGNOSTIC_UPLOAD_ENDPOINT: ${{ vars.VITE_DIAGNOSTIC_UPLOAD_ENDPOINT }}
      - run: deno task browser:install --with-deps
      - run: deno task test:browser
      - name: Package Pages
        run: |
          mkdir -p .ci-artifacts
          tar --dereference --hard-dereference -C dist -cf .ci-artifacts/artifact.tar .
          python3 -m zipfile -c .ci-artifacts/pages.zip .ci-artifacts/artifact.tar
      - id: artifact
        uses: ./.github/actions/deno-artifact
        with:
          name: github-pages
          zip: .ci-artifacts/pages.zip
          retention: '1'
      - name: Deploy Pages
        id: deployment
        if: github.ref == 'refs/heads/experiment'
        run: deno run --no-prompt --allow-env --allow-net --allow-write scripts/ci-pages.ts "${{ steps.artifact.outputs.artifact-id }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
