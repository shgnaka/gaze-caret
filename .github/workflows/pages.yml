name: Publish experiment

on:
  push:
    branches: [experiment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Build experiment
        run: npm run build
        env:
          VITE_DIAGNOSTIC_UPLOAD_ENDPOINT: ${{ vars.VITE_DIAGNOSTIC_UPLOAD_ENDPOINT }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/experiment'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
