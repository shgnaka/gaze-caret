name: CI
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core-checks:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout with Git
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Install verified Deno
        run: bash scripts/ci-install-deno.sh
      - run: deno ci
      - run: deno task check
      - run: deno task build
      - run: deno task browser:install --with-deps
      - run: deno task test:browser
      - name: Package experiment
        run: |
          mkdir -p .ci-artifacts
          python3 -c 'import pathlib,zipfile; root=pathlib.Path("dist"); z=zipfile.ZipFile(".ci-artifacts/experiment.zip","w",zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in root.rglob("*") if p.is_file()]; z.close()'
      - name: Save experiment bundle
        uses: ./.github/actions/deno-artifact
        with:
          name: gaze-caret-experiment
          zip: .ci-artifacts/experiment.zip
          retention: '14'
